<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div style="background-color: #b8c16e; padding: 10px; font-size: 16px">
    <div style="background-color: #b8c16e; line-height: 80px; color: #fcfcfc; font-size: 30px; text-align: center;">
        Confirm Email
    </div>
    <div style="background-color: #fcfcfc; color: #1d1d1d;border-radius: 2px; padding: 20px">
        Hi <span th:text="${name}">there</span>,
        <p>
            Please click the link below to confirm registration:
        </p>
        <p>
            <a th:href="${verify_link}" th:text="${verify_link}">verify link</a>
        </p>
        <p>
            Thank you,<br/>
            <a href="https://www.faithfulplanner.com">faithfulplanner.com</a>
        </p>
    </div>
    <div style="background-color: #b8c16e; color: #fcfcfc; font-size: 12px; text-align: center; line-height: 50px">
        <a style="color: #fcfcfc;" href="https://www.faithfulplanner.com">
            faithfulplanner.com
        </a>
    </div>
</div>
</body>
</html>
